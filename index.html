<style>
:root{--navy:#14213D;--blue:#1D5FA7;--sky:#E3EEF9;--bg:#F4F7FB;--ink:#1A202C;--slate:#4A5568;--line:#D5DCE5;
--l1:#2E7D5B;--l1b:#E1F2EA;--l2:#9A7B0A;--l2b:#FFF4D6;--l2d:#E3B505;--l3:#C46A12;--l3b:#FBEBD9;--l4:#B23A48;--l4b:#F8E1E4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 Inter,'Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--card)}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;position:sticky;top:0;z-index:15;flex-wrap:wrap}
.top b{font-size:16px}.pill{font-size:11px;background:var(--card)fff22;padding:2px 8px;border-radius:20px}.sp{flex:1}
.top select{background:var(--card)fff18;color:#fff;border:1px solid #ffffff44;padding:4px 8px}.top select option{color:#000}
.clock{display:flex;gap:6px;align-items:center;background:var(--card)fff14;padding:3px 8px;border-radius:8px;font-size:12px}
.clock button{background:var(--card)fff22;color:#fff;border:0;border-radius:6px;padding:3px 7px;font-size:12px}
.wrap{display:flex;min-height:calc(100vh - 48px)}
nav{width:212px;background:var(--card);border-right:1px solid var(--line);padding:12px 8px;flex-shrink:0}
nav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink)}
nav button.on{background:var(--sky);color:var(--blue);font-weight:600}nav button .n{margin-left:auto;font-size:11px;background:var(--l4);color:#fff;border-radius:10px;padding:0 6px}
main{flex:1;padding:20px;min-width:0}
h1{font-size:21px;margin:0 0 2px;color:var(--navy)}.sub{color:var(--slate);margin:0 0 16px}
h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:600}
.btn.s{padding:4px 9px;font-size:12px}.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--blue)}.btn.red{background:var(--l4)}.btn.green{background:var(--l1)}.btn.orange{background:var(--l3)}
.lv{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;padding:2px 9px;border-radius:20px}
.lv i{width:8px;height:8px;border-radius:50%;display:inline-block}
.L1{background:var(--l1b);color:var(--l1)}.L1 i{background:var(--l1)}.L2{background:var(--l2b);color:var(--l2)}.L2 i{background:var(--l2d)}
.L3{background:var(--l3b);color:var(--l3)}.L3 i{background:var(--l3)}.L4{background:var(--l4b);color:var(--l4)}.L4 i{background:var(--l4)}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-align:left;color:var(--slate);font-weight:600;padding:7px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:8px 7px;border-bottom:1px solid var(--line2);vertical-align:middle}tr.click:hover td{background:var(--soft);cursor:pointer}
.muted{color:var(--slate);font-size:12px}.kpi{font-size:26px;font-weight:700;color:var(--navy)}
.pipe{display:flex;gap:3px;align-items:center;flex-wrap:wrap}.st{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--slate);white-space:nowrap}
.st.done{background:var(--l1b);color:var(--l1)}.st.cur{background:var(--blue);color:#fff;font-weight:600}
.heat td{text-align:center;font-weight:600;border:2px solid var(--card);border-radius:4px}
.bar{height:8px;background:var(--line2);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--card);box-shadow:-8px 0 30px #0002;padding:18px;overflow:auto;transform:translateX(105%);transition:.25s;z-index:30}
.drawer.open{transform:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;display:none;z-index:50;max-width:90%}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;margin-bottom:9px;font-size:12.5px}
.tl div::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:13px}
.preview{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:12.5px;white-space:pre-line}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);font-size:11.5px}
.thumb img{width:100%;height:100px;object-fit:cover;display:block;background:var(--line2)}.thumb div{padding:6px 8px}
.ok{color:var(--l1);font-weight:700}.warn{color:var(--l3);font-weight:700}.bad{color:var(--l4);font-weight:700}
/* chat */
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-size:24px;box-shadow:0 6px 18px #1D5FA766;z-index:25}
.chatbox{position:fixed;right:20px;bottom:86px;width:min(390px,calc(100% - 24px));height:min(560px,calc(100vh - 120px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px #0003;display:none;flex-direction:column;z-index:26}
.chatbox.open{display:flex}.chead{background:var(--navy);color:#fff;padding:10px 12px;border-radius:14px 14px 0 0;display:flex;align-items:center;gap:8px}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 11px;border-radius:12px;white-space:pre-line;font-size:13px}.m.bot{background:var(--sky)}.m.me{background:var(--blue);color:#fff;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 6px}.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:3px 9px;font-size:12px}
.inbar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.inbar input{flex:1;border-radius:20px}
.mic{width:38px;height:38px;border-radius:50%;border:0;background:var(--l4);color:#fff}.mic.live{animation:p 1s infinite}@keyframes p{0%{box-shadow:0 0 0 0 #B23A4866}100%{box-shadow:0 0 0 12px #B23A4800}}
.ladder{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ladder span{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600}
@media(max-width:900px){.wrap{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}
.g3,.g4,.g5{grid-template-columns:1fr 1fr}.g2{grid-template-columns:minmax(0,1fr)}.card{overflow:auto}main{padding:12px}.hide-m{display:none}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--navy)}
.top{top:env(safe-area-inset-top,0px)!important;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.fab{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
:root{color-scheme:light}
.jrn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.js{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px}
.js b{background:var(--blue);color:#fff;border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px}
.js span{font-weight:600;font-size:12.5px;color:var(--navy)}.js small{display:block;font-weight:400;color:var(--slate);font-size:11px}
.js.off{opacity:.45;cursor:default}
.chk6{display:grid;gap:6px}.chk6 div{display:flex;flex-direction:column;border-radius:8px;padding:7px 10px;font-size:12.5px}
.chk6 .ok{background:var(--l1b);color:var(--l1)}.chk6 .warn{background:var(--l3b);color:var(--l3)}.chk6 .bad{background:var(--l4b);color:var(--l4)}.chk6 span{color:var(--ink);font-weight:400}
.vox{display:flex;flex-direction:column;gap:12px}.vtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--blue);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--blue);padding:5px 12px}.seg button.on{background:var(--blue);color:#fff}
.orb{width:110px;height:110px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:40px;margin:6px auto 0;display:block}
.orb.live{background:var(--l4);animation:p 1s infinite}
.vlog{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.phone{background:var(--navy);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%;margin:0 auto 14px}
.ptop{color:#fff;text-align:center}.ptop small{display:block;color:#cbd5e1}.ptop div{font-size:12px;color:#9AE6B4;margin-top:2px}
.plog{background:var(--card);border-radius:14px;height:260px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{border:0;border-radius:12px;padding:10px;font-size:18px;font-weight:700;background:var(--card)fff1f;color:#fff}
.pin{display:flex;gap:6px}.pin input{flex:1;border-radius:20px}
.pbtn{display:flex;justify-content:center}.dial{border:0;border-radius:24px;padding:10px 28px;font-weight:700;background:var(--l1);color:#fff;font-size:15px}.dial.end{background:var(--l4)}
.tld{margin:12px 0 6px -14px;font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em}

/* ===== v7 design system ===== */
:root{--card:#fff;--soft:#F8FAFD;--line2:#EEF2F7;--head:#14213D;--topdim:#cbd5e1;--shadow:0 1px 2px #14213D0f,0 4px 14px #14213D0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0B1322;--blue:#5B9BE6;--sky:#1B2A44;--bg:#0E1626;--ink:#E6EBF3;--slate:#9AA7BA;--line:#2A3850;--line2:#1F2B40;--card:#152034;--soft:#1A263C;--head:#F1F5FB;
--l1:#4CC38A;--l1b:#163A2C;--l2:#E9C74A;--l2b:#3A3216;--l2d:#E9C74A;--l3:#F29A4A;--l3b:#43291A;--l4:#F0707E;--l4b:#46202A;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#0B1322;--blue:#5B9BE6;--sky:#1B2A44;--bg:#0E1626;--ink:#E6EBF3;--slate:#9AA7BA;--line:#2A3850;--line2:#1F2B40;--card:#152034;--soft:#1A263C;--head:#F1F5FB;
--l1:#4CC38A;--l1b:#163A2C;--l2:#E9C74A;--l2b:#3A3216;--l2d:#E9C74A;--l3:#F29A4A;--l3b:#43291A;--l4:#F0707E;--l4b:#46202A;--shadow:none;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
h1,h3,.kpi,.js span{color:var(--head)}
input,select,textarea{background:var(--card);color:var(--ink)}
.card{box-shadow:var(--shadow)}
nav{background:var(--card);border-color:var(--line);width:224px}
.drawer,.chatbox{background:var(--card);color:var(--ink)}
.m.me{color:#fff}.st.cur{color:#fff}
.btn.ghost{background:transparent}
:root[data-theme="dark"] .btn:not(.ghost):not(.red):not(.green):not(.orange),:root[data-theme="dark"] .m.me,:root[data-theme="dark"] .st.cur,:root[data-theme="dark"] .fab{color:#0B1322}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.red):not(.green):not(.orange),:root:not([data-theme="light"]) .m.me,:root:not([data-theme="light"]) .st.cur,:root:not([data-theme="light"]) .fab{color:#0B1322}}
.tbtn{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:4px 9px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);padding:12px 10px 4px}
.grp:first-child{padding-top:2px}
nav button .n{margin-left:auto;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;color:#fff}
nav button .n.L1{background:var(--l1)}nav button .n.L2{background:var(--l2d);color:#2B2306}nav button .n.L3{background:var(--l3)}nav button .n.L4{background:var(--l4)}
.legend{margin:16px 6px 4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:11.5px;color:var(--slate);display:grid;gap:5px}
.legend b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.kts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}
.kt{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.kt small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate)}
.kt b{display:block;font-size:28px;line-height:1.2;color:var(--head);margin:2px 0 6px}
.kt.L1{border-left-color:var(--l1)}.kt.L2{border-left-color:var(--l2d)}.kt.L3{border-left-color:var(--l3)}.kt.L4{border-left-color:var(--l4)}
.kt.L1,.kt.L2,.kt.L3,.kt.L4{background:var(--card)}
.homeg{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:0}.task>div{flex:1;min-width:0}.task b{display:block;font-size:13px}.task small{color:var(--slate);font-size:11.5px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.L1{background:var(--l1)}.dot.L2{background:var(--l2d)}.dot.L3{background:var(--l3)}.dot.L4{background:var(--l4)}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.act{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line2)}.act:last-child{border-bottom:0}.act small{color:var(--slate)}
.toast{border:1px solid var(--line);box-shadow:var(--shadow)}
.empty{text-align:center;padding:22px 10px;color:var(--slate)}.empty div{font-size:30px}
@media(max-width:900px){nav{width:auto}.grp,.legend{display:none}.homeg{grid-template-columns:minmax(0,1fr)}nav button .n{margin-left:6px}}

/* ===== v9 two linked sites ===== */
:root[data-portal="people"]{--navy:#0B4F57}
@media (prefers-color-scheme:dark){:root[data-portal="people"]:not([data-theme="light"]){--navy:#08262A}}
:root[data-portal="people"][data-theme="dark"]{--navy:#08262A}
.site{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#ffffff22;border-radius:6px;padding:3px 8px}
.xlink{color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;border:1px solid #ffffff44;border-radius:8px;padding:4px 9px;white-space:nowrap}.xlink:hover{background:#ffffff1a}
.live{font-size:12px;color:#cbd5e1;white-space:nowrap}.live::before{content:"●";margin-right:4px;color:#5FD39A}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.how div{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--slate)}.how b{display:block;color:var(--head);font-size:12.5px}.how .me{border-color:var(--blue)}
.trk{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.trk div{flex:1;min-width:110px;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;color:var(--slate)}
.trk b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line2);color:var(--slate);font-size:12px;flex-shrink:0}
.trk .done{border-color:var(--l1);color:var(--ink)}.trk .done b{background:var(--l1);color:#fff}.trk .now{border-color:var(--blue);color:var(--ink);font-weight:600}.trk .now b{background:var(--blue);color:#fff}
@media(max-width:700px){.how{grid-template-columns:minmax(0,1fr)}.site{display:none}}
/* AnuPalan Seva: calm, plain, phone-first. Teal for trust, one accent, the same green/amber/orange/red meaning as the officials site. */
:root{--sv-bg:#F4F8F8;--sv-card:#FFFFFF;--sv-ink:#14262A;--sv-mute:#52666B;--sv-line:#D6E2E3;--sv-soft:#EAF3F3;
 --sv-brand:#0B5A63;--sv-brand2:#0E7480;--sv-on:#FFFFFF;--sv-focus:#F2B705;

 S.acc.filter(a=>a.inst===I.name).forEach(a=>{[["sexp","structural stability"],["fexp","fire NOC"]].forEach(([k,lb])=>{const left=a[k]-S.today;if(left<0){s+=15;why.push(`${a.kind} '${a.name}': ${lb} EXPIRED (+15)`)}else if(left<=30){s+=6;why.push(`${a.kind} '${a.name}': ${lb} expires in ${left} d (+6)`)}});

  <p class="sv-err" id="sve"></p><div class="sv-nav"><button class="sv-ghost" onclick="sv.back()">← ${t("back")}</button><button class="sv-next sv-send" id="svs" onclick="sv.send()">✔ ${t("send")}</button></div>`}
function done(r){const u=t("urgent")[r.level-1];
 return `<section class="sv-done"><div class="sv-tick">✓</div><h1>${t("done")}</h1><p class="sv-help">${t("num")}</p><div class="sv-num" id="svn">${esc(r.id)}</div>
 <button class="sv-sec" onclick="sv.copy('${esc(r.id)}')">📋 ${t("copy")}</button><p class="sv-help">${t("save")}</p>
 <div class="sv-card sv-lvl l${r.level}"><b>${u}</b> · ${t("reply")} <b>${esc(r.due)}</b></div>
 <div class="sv-card"><h2 class="sv-h2" style="margin-top:0">${t("whatNext")}</h2><ol class="sv-how sm"><li><b>1</b><div>${t("n1")}</div></li><li><b>2</b><div>${t("n2")}</div></li><li><b>3</b><div>${t("n3")}</div></li></ol></div>
 <button class="sv-big" onclick="sv.trackId('${esc(r.id)}')">🔎 ${t("trackIt")}</button><button class="sv-ghost wide" onclick="sv.go('home')">${t("home")}</button></section>`}
function track(){return `<h1 class="sv-q">${t("tTitle")}</h1><p class="sv-help">${t("tSub")}</p><form onsubmit="event.preventDefault();sv.lookup()" class="sv-row"><input class="sv-in1" id="svtq" value="${esc(lastId)}" placeholder="CMP-27-000419" style="flex:1" aria-label="${t("tTitle")}"><button class="sv-next">${t("tBtn")}</button></form><div id="svtr"></div>`}
function trackCard(d){const st=d.kind==="application"?d.stages:t("st"),cur=d.stage,cmp=d.kind!=="application";
 const cls=i=>cmp?(i<=cur?"done":i===cur+1?"now":""):(i<cur||(i===cur&&cur===st.length-1)?"done":i===cur?"now":"");
 return `<div class="sv-card"><div class="sv-tid">${esc(d.id)}</div><div class="sv-help" style="margin:2px 0 12px">${esc(d.inst)}${d.category?" · "+esc(d.category):""}${d.filed?" · "+esc(d.filed):""}</div>
 <ol class="sv-steps">${st.map((x,i)=>`<li class="${cls(i)}"><b>${cls(i)==="done"?"✓":i+1}</b>${esc(x)}</li>`).join("")}</ol>
 ${d.kind==="complaint"&&d.status!=="Closed"?(d.left<0?`<div class="sv-card sv-lvl l3">${t("late")}</div>`:`<div class="sv-card sv-lvl l1">${t("onTime")} <b>${esc(d.due)}</b></div>`):""}
 ${d.action?`<div class="sv-card sv-acted"><b>${t("acted")}</b><p>${esc(d.action)}</p></div>`:""}
 <h2 class="sv-h2">${t("history")}</h2><ul class="sv-hist">${d.events.map(e=>`<li><b>${esc(e.date)}</b> ${esc(e.step)}</li>`).join("")}</ul></div>`}
function call(){const h=SEVA.helpline;return `<h1 class="sv-q">${t("callTitle")}</h1><p class="sv-help">${t("callSub")}</p><div class="sv-card sv-callnum"><span>📞</span><b>${esc(h.number)}</b><small>${esc(h.hours)}</small></div>
 ${SEVA.demoCall?`<button class="sv-big" onclick="SEVA.demoCall()">▶ ${L==="en"?"Try the helpline demo":"हेल्पलाइन डेमो आज़माएं"}</button>`:""}<button class="sv-ghost wide" onclick="sv.go('home')">${t("home")}</button>`}
function draw(){const body=view==="home"?home():view==="wiz"?wiz():view==="done"?done(window._svr):view==="track"?track():call();
 document.getElementById("seva").innerHTML=shell(body);document.documentElement.lang=L==="en"?"en":"hi";
 const q=$("#svq");if(q){q.oninput=()=>{F.q=q.value;$("#svl").innerHTML=listHTML()}}
 const ta=$("#svt");if(ta)ta.oninput=()=>{F.text=ta.value}}
const focusMain=()=>{scrollTo(0,0);const m=$("#svm");if(m)m.focus({preventScroll:true})};
window.sv={
 go(v){view=v;draw();focusMain();if(v==="track"&&lastId)sv.lookup()},
 start(){reset();view="wiz";draw();focusMain()},
 to(s){step=s;draw();focusMain()},
 back(){if(step<=1){view="home";draw();focusMain();return}step--;draw();focusMain()},
 next(){if(step===3){const v=($("#svt").value||"").trim();F.text=v;if(v.length<15){$("#sve").textContent=t("min");$("#svt").focus();return}}step++;draw();focusMain()},
 pickI(i){F.inst=INSTS[+i];F.q=F.inst;draw();const b=document.querySelector('.sv-next');if(b)b.focus()},topic(i){F.topic=i;draw()},who(i){F.who=i;draw()},set(k,v){F[k]=v},
 photo(inp){const f=inp.files&&inp.files[0];if(!f)return;F.photo=f;F.photoUrl=URL.createObjectURL(f);F.text=($("#svt")||{}).value||F.text;draw()},
 nophoto(){F.photo=null;F.photoUrl="";F.text=($("#svt")||{}).value||F.text;draw()},
 mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$("#svmic");
  const fail=()=>{b.textContent="🎙️ "+t("speak");$("#sve").textContent=L==="en"?"Voice is not available in this browser. Please type instead.":"इस ब्राउज़र में आवाज़ उपलब्ध नहीं है। कृपया लिखें।"};
  if(!SR){fail();return}try{const r=new SR();r.lang=L==="en"?"en-IN":"hi-IN";r.interimResults=false;b.textContent="🔴 "+t("listening");
   r.onresult=e=>{const ta=$("#svt");ta.value=(ta.value?ta.value+" ":"")+e.results[0][0].transcript;F.text=ta.value;F.voice=true};r.onerror=fail;r.onend=()=>{b.textContent="🎙️ "+t("speak")};r.start()}catch(e){fail()}},
 async send(){const b=$("#svs");b.disabled=true;b.textContent=t("sending");
  try{const tp=TOPICS[F.topic];window._svr=await SEVA.file({inst:F.inst,topic:tp[3],text:F.text,who:WHO[F.who][0],anon:F.anon,contact:F.contact,photo:F.photo,voice:F.voice});
   lastId=window._svr.id;view="done";draw();focusMain()}catch(e){b.disabled=false;b.textContent="✔ "+t("send");$("#sve").textContent=e.message||String(e)}},
 copy(id){const ok=()=>{const n=$("#svn");if(n)n.dataset.c=t("copied")};try{navigator.clipboard.writeText(id).then(ok,()=>{selectNum()})}catch(e){selectNum()}},
 trackId(id){lastId=id;view="track";draw();focusMain();sv.lookup()},
 async lookup(){const i=$("#svtq"),id=(i?i.value:lastId).trim().toUpperCase();if(!id)return;lastId=id;const box=$("#svtr");
  try{const d=await SEVA.track(id);box.innerHTML=trackCard(d)}catch(e){box.innerHTML=`<div class="sv-card sv-lvl l3">${t("notFound")}</div>`}},
 lang(){L=L==="en"?"hi":"en";try{localStorage.setItem("seva_lang",L)}catch(e){}draw();if(view==="track"&&lastId)sv.lookup()},
 refresh(){if(view==="track"&&lastId&&$("#svtr")&&$("#svtr").innerHTML)sv.lookup()}};
function selectNum(){const n=$("#svn");if(!n)return;const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}
(async()=>{try{INSTS=(await SEVA.insts()).slice().sort()}catch(e){INSTS=[]}
 const h=(location.hash||"").slice(1);if(h==="track"||h==="report"||h==="call"){if(h==="report")sv.start();else sv.go(h)}else draw()})();
})();


</script>
<script>
/* Sahayak: the chat bot on the complaint site. Report a problem by chatting or speaking, track a number, get plain answers.
   Uses only window.SEVA (insts, file, track, helpline) so it works on the server and offline. Prototype brain = rules;
   production swaps in Bhashini speech + an LLM with the same SEVA calls. */
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hi=()=>document.documentElement.lang==="hi";
const W=(en,h)=>hi()?h:en;
const TOP=[["Structural / building safety","🏚️ Building or hostel is unsafe","🏚️ इमारत या हॉस्टल असुरक्षित",/crack|collapse|ceiling|plaster|leak|seepage|unsafe|daraar|deewar|chhat|दरार|छत|गिर|दीवार/],
 ["Fire safety","🔥 Fire safety","🔥 आग से सुरक्षा",/fire|extinguisher|\baag\b|short circuit|आग|अग्निशामक/],
 ["Ragging / harassment / violence","🚫 Ragging, harassment or violence","🚫 रैगिंग, उत्पीड़न या हिंसा",/ragging|harass|assault|threat|bully|beat|maar|dhamki|रैगिंग|धमकी|मार|परेशान/],
 ["Fees / refund","💰 Extra fees or no refund","💰 ज़्यादा फीस या रिफंड नहीं",/\bfee|fees|refund|donation|capitation|paisa|paise|rupees|फीस|पैसे|रुपये|रिफंड/],
 ["Faculty / salary","👩‍🏫 Teachers missing or unpaid","👩‍🏫 शिक्षक नहीं या वेतन नहीं",/teacher|salary|faculty|professor|class(es)? not|शिक्षक|वेतन|टीचर|कक्षा/],
 ["Hostel / food / water","🍽️ Hostel food, water or toilets","🍽️ हॉस्टल खाना, पानी, शौचालय",/food|water|toilet|mess|electricity|khana|paani|bijli|खाना|पानी|शौचालय|बिजली/],
 ["Infrastructure / labs / library","🧪 Labs, library or classrooms","🧪 लैब, लाइब्रेरी, कक्षाएं",/\blab|library|computer|classroom|projector|लैब|लाइब्रेरी|कंप्यूटर/],
 ["Unapproved / fake programme","⚠️ Course or college not approved","⚠️ कोर्स या कॉलेज मान्य नहीं",/fake|not approved|unapproved|fraud|nakli|नकली|मान्यता/],
 ["","💬 Something else","💬 कुछ और",/^$/]];
const WHO=[["Student","छात्र"],["Parent","माता-पिता"],["Professor","शिक्षक"],["Staff","कर्मचारी"],["Public","आम नागरिक"]];
const URG=[["Normal","सामान्य"],["Important","ज़रूरी"],["High","गंभीर"],["Urgent","अति गंभीर"]];
let INSTS=[],st="idle",R={},voiceIn=false,speakOn=false,open=false;
const STOP=new Set(["of","the","and","institute","college","technology","engineering","school","university","at","in","my","our","for","a","an","is","hai","ka","ki","ke","me","mein"]);
function matchInst(text){const t=text.toLowerCase();if(/iiit|triple i|bbsr|bhubaneswar|भुवनेश्वर|ट्रिपल/.test(t)){const x=INSTS.find(n=>/IIIT Bhubaneswar/i.test(n));if(x)return [x]}
 const words=t.match(/[a-z]+/g)||[];const sc=INSTS.map(n=>{const k=(n.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>!STOP.has(w));const hit=k.filter(w=>words.some(x=>x.length>2&&(w.startsWith(x)||x.startsWith(w)))).length;return [n,k.length?hit/k.length:0]});
 const best=sc.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);if(!best.length)return [];if(best[0][1]>=.5&&(!best[1]||best[1][1]<best[0][1]))return [best[0][0]];return best.slice(0,4).map(x=>x[0])}
const guessTopic=t=>{const s=t.toLowerCase();const i=TOP.findIndex(x=>x[3].source!=="^$"&&x[3].test(s));return i};
const idOf=t=>{const m=t.toUpperCase().match(/\b(CMP|APP)[\s-]*(\d{2})[\s-]*(\d{4,6})\b/);return m?(m[1]==="CMP"?`CMP-${m[2]}-${m[3].padStart(6,"0")}`:`APP-${m[2]}-${m[3]}`):null};
function ui(){if($("#sbot"))return;const d=document.createElement("div");d.innerHTML=`<button class="sb-fab" id="sbfab" aria-label="${W("Chat with Sahayak, the AI helper","सहायक से बात करें")}"><span>🤖</span><b>${W("Ask Sahayak","सहायक से पूछें")}</b></button>
 <section class="sb-panel" id="sbot" role="dialog" aria-label="Sahayak" hidden><header><span class="sb-av">🤖</span><div><b>Sahayak</b><small>${W("AI helper · English or Hindi","AI सहायक · हिंदी या अंग्रेज़ी")}</small></div><button id="sbtts" title="Read replies aloud" aria-label="Read replies aloud">🔇</button><button id="sbx" aria-label="Close">✕</button></header>
 <div class="sb-msgs" id="sbm" aria-live="polite"></div><div class="sb-chips" id="sbc"></div>
 <form class="sb-in" id="sbf"><button type="button" class="sb-mic" id="sbmic" aria-label="Speak">🎙️</button><input id="sbi" autocomplete="off" placeholder="${W("Type here, or tap 🎙️ and speak","यहाँ लिखें, या 🎙️ दबाकर बोलें")}" aria-label="Message"><button class="sb-send" aria-label="Send">➤</button></form></section>`;
 document.body.appendChild(d);$("#sbfab").onclick=()=>toggle(true);$("#sbx").onclick=()=>toggle(false);
 $("#sbf").onsubmit=e=>{e.preventDefault();const v=$("#sbi").value.trim();if(!v)return;$("#sbi").value="";voiceIn=false;user(v)};$("#sbmic").onclick=mic;
 $("#sbtts").onclick=()=>{speakOn=!speakOn;$("#sbtts").textContent=speakOn?"🔊":"🔇";if(!speakOn&&window.speechSynthesis)speechSynthesis.cancel()}}
function toggle(o){open=o;$("#sbot").hidden=!o;$("#sbfab").hidden=o;if(o){if(!$("#sbm").children.length)greet();$("#sbi").focus()}}
function bubble(who,html){const m=document.createElement("div");m.className="sb-m "+who;m.innerHTML=html;$("#sbm").appendChild(m);$("#sbm").scrollTop=1e6;return m}
function bot(html,chips){bubble("bot",html);$("#sbc").innerHTML=(chips||[]).map((c,i)=>`<button type="button" data-i="${i}">${esc(c)}</button>`).join("");
 $("#sbc").querySelectorAll("button").forEach(b=>b.onclick=()=>{voiceIn=false;user(chips[+b.dataset.i])});
 if((speakOn||voiceIn)&&window.speechSynthesis){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(html.replace(/<[^>]+>/g," ").replace(/\s+/g," "));u.lang=hi()?"hi-IN":"en-IN";speechSynthesis.speak(u)}catch(e){}}}
function user(text){bubble("me",esc(text));setTimeout(()=>think(text),250)}
const MENU=()=>[W("Report a problem","समस्या बताएं"),W("Track my complaint","मेरी शिकायत देखें"),W("Is my name safe?","क्या मेरा नाम छिपा रहेगा?"),W("How long will it take?","कितना समय लगेगा?")];
function greet(){st="idle";bot(W("Namaste! I'm <b>Sahayak</b>, AICTE's AI helper. Tell me in your own words what is wrong at your college, and I will report it for you. You can type or speak, in English or Hindi.",
 "नमस्ते! मैं <b>सहायक</b> हूँ, AICTE का AI मददगार। अपने शब्दों में बताइए कि आपके कॉलेज में क्या गलत है, मैं आपकी शिकायत दर्ज कर दूँगा। आप लिख सकते हैं या बोल सकते हैं।"),MENU())}
function askInst(){const m=matchInst(R.text||"");if(m.length===1){R.inst=m[0];return askTopic()}
 st="inst";bot(W("Which college is this about? Type its name.","यह किस कॉलेज के बारे में है? नाम लिखें।"),m.length?m:INSTS.slice(0,4))}
function askTopic(){const g=guessTopic(R.text||"");if(g>=0){R.topic=g;st="topic_ok";return bot(W(`I understand this is about <b>${TOP[g][1].replace(/^\S+\s/,"")}</b>. Is that right?`,`मैं समझा, यह <b>${TOP[g][2].replace(/^\S+\s/,"")}</b> के बारे में है। सही है?`),[W("Yes","हाँ"),W("No, choose another","नहीं, दूसरा चुनें")])}
 st="topic";bot(W("What is it about? Pick the closest one.","यह किस बारे में है? सबसे करीब वाला चुनें।"),TOP.map(x=>hi()?x[2]:x[1]))}
function askWho(){st="who";bot(W("Thank you. Who are you?","धन्यवाद। आप कौन हैं?"),WHO.map(w=>hi()?w[1]:w[0]))}
function askAnon(){st="anon";bot(W("Shall I keep your name hidden from the college? (Recommended)","क्या मैं आपका नाम कॉलेज से छिपा दूँ? (सलाह: हाँ)"),[W("Yes, keep it hidden","हाँ, छिपाएं"),W("No, AICTE may share it","नहीं, AICTE बता सकता है")])}
function askPhone(){st="phone";bot(W("Would you like SMS updates? Type your 10-digit mobile number, or tap Skip. Only AICTE sees it.","क्या आप SMS अपडेट चाहते हैं? 10 अंकों का मोबाइल नंबर लिखें, या छोड़ें दबाएं। सिर्फ AICTE देखता है।"),[W("Skip","छोड़ें")])}
function confirm(){st="confirm";const tp=TOP[R.topic];
 bot(W("Please check:","कृपया जाँचें:")+`<div class="sb-sum"><div><small>${W("College","कॉलेज")}</small>${esc(R.inst)}</div><div><small>${W("Problem","समस्या")}</small>${esc(hi()?tp[2]:tp[1])}</div><div><small>${W("What happened","क्या हुआ")}</small>${esc(R.text)}</div><div><small>${W("You","आप")}</small>${esc(hi()?WHO[R.who][1]:WHO[R.who][0])} · ${R.anon?W("name hidden","नाम छिपा"):W("name shared with AICTE","नाम AICTE को")}${R.contact?" · 📱 "+esc(R.contact):""}</div></div>`,
  [W("✔ Send to AICTE","✔ AICTE को भेजें"),W("Start again","फिर से शुरू करें")])}
async function submit(){bot(W("Sending…","भेज रहे हैं…"));
 try{const tp=TOP[R.topic];const r=await SEVA.file({inst:R.inst,topic:tp[0],text:R.text,who:WHO[R.who][0],anon:R.anon,contact:R.contact,photo:null,voice:R.voice,chat:true});st="idle";
  bot(W(`✅ Done. Your complaint number is <b class="sb-id">${esc(r.id)}</b>.<br><b>${URG[r.level-1][0]}</b>: AICTE will reply by <b>${esc(r.due)}</b>. It is already on the AICTE officials' screen. Please write the number down.`,
   `✅ हो गया। आपका शिकायत नंबर <b class="sb-id">${esc(r.id)}</b> है।<br><b>${URG[r.level-1][1]}</b>: AICTE <b>${esc(r.due)}</b> तक जवाब देगा। यह AICTE अधिकारियों की स्क्रीन पर पहुँच चुकी है। नंबर लिख लें।`),[W(`Track ${r.id}`,`देखें ${r.id}`),W("Report another","एक और शिकायत")]);R.last=r.id}
 catch(e){st="phone";bot(W("Sorry, that did not go through: ","माफ़ कीजिए, नहीं भेजा जा सका: ")+esc(e.message||e),[W("Skip","छोड़ें")])}}
async function track(id){try{const d=await SEVA.track(id);
  if(d.kind==="application")return bot(W(`${esc(d.id)} (${esc(d.inst)}) is at <b>${esc(d.stages[d.stage])}</b>, step ${d.stage+1} of ${d.stages.length}.`,`${esc(d.id)} (${esc(d.inst)}) अभी <b>${esc(d.stages[d.stage])}</b> चरण में है (${d.stage+1}/${d.stages.length})।`),MENU());
  const S1=[["has been received","मिल गई है"],["is being looked into by an AICTE officer","की जाँच AICTE अधिकारी कर रहे हैं"],["has been acted on","पर कार्रवाई हो चुकी है"],["has been closed","बंद हो गई है"]][d.stage]||["has been received","मिल गई है"];
  let msg=W(`Complaint <b>${esc(d.id)}</b> about ${esc(d.inst)} <b>${S1[0]}</b>.`,`शिकायत <b>${esc(d.id)}</b> (${esc(d.inst)}) <b>${S1[1]}</b>।`);
  if(d.action)msg+=`<br>${W("What AICTE did","AICTE ने क्या किया")}: “${esc(d.action)}”`;
  else if(d.status!=="Closed")msg+="<br>"+(d.left<0?W("The reply is late, so it has gone to a senior officer automatically.","जवाब में देर हुई, इसलिए यह अपने आप वरिष्ठ अधिकारी के पास चली गई है।"):W(`AICTE will reply by <b>${esc(d.due)}</b>.`,`AICTE <b>${esc(d.due)}</b> तक जवाब देगा।`));
  bot(msg,[W("Show full status","पूरी स्थिति देखें"),W("Report a problem","समस्या बताएं")]);R.last=d.id}
 catch(e){bot(W("I could not find that number. It looks like CMP-27-000419. Please check your SMS.","यह नंबर नहीं मिला। यह CMP-27-000419 जैसा दिखता है। कृपया अपना SMS देखें।"),[W("Track my complaint","मेरी शिकायत देखें")])}}
